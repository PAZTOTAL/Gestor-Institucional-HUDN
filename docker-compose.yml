services:

  web:
    build: .
    restart: unless-stopped
    privileged: true
    env_file: .env
    volumes:
      - media:/app/media
      - sessions:/app/sessions
      - playwright_browsers:/playwright-browsers
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/app/media
    depends_on:
      - web

volumes:
  media:
  sessions:
  playwright_browsers:
