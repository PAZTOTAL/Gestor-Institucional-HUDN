services:

  web:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - media:/app/media
      - sessions:/app/sessions
      - playwright_browsers:/playwright-browsers

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/app/media
    depends_on:
      - web

volumes:
  media:
  sessions:
  playwright_browsers:
